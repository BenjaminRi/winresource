[package]
name = "multi_binary_example"
description = "Winresource - example script for a library with 2 binaries"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[build-dependencies]
winresource = { path = ".." }

[[bin]]
name = "example-a"
path = "src/bin/a.rs"

[[bin]]
name = "example-b"
path = "src/bin/b.rs"
